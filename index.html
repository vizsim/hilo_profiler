<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HiLo-Profiler</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="map"></div>

  <section id="routing-panel" class="routing-panel" aria-labelledby="panel-title">
    <div class="routing-header">
      <div class="routing-title">
        <img src="./favicon.svg" alt="" class="routing-logo" aria-hidden="true">
        <div>
          <p class="panel-kicker">Hilo Profiler</p>
          <h1 id="panel-title">Höhenprofil</h1>
        </div>
      </div>
      <div class="routing-header-actions">
        <span id="status-badge" class="status-badge">Bereit</span>
        <button
          id="routing-panel-toggle"
          class="panel-toggle"
          type="button"
          aria-expanded="true"
          aria-controls="routing-panel-content"
          title="Panel minimieren"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="sr-only">Panel minimieren</span>
        </button>
      </div>
    </div>

    <div id="routing-panel-content" class="routing-content">
      <div id="routing-note" class="routing-note">
        Setze zwei Punkte auf der Karte oder nutze den Rechtsklick für Start, Ziel und Zwischenpunkte.
      </div>

      <div class="profile-block">
        <div class="section-title-row">
          <h2>Profil</h2>
        </div>
        <div id="profile-empty" class="profile-empty" hidden></div>
        <div class="profile-canvas-shell" id="profile-canvas-shell" hidden>
          <canvas id="heightgraph-canvas"></canvas>
        </div>
        <div id="profile-summary" class="profile-summary" hidden>
          <div class="summary-card summary-card-wide summary-card-distance">
            <div class="summary-stat">
              <span class="summary-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M5 7.5v9M19 7.5v9M8 12h8M9.5 9.5 8 12l1.5 2.5M14.5 9.5 16 12l-1.5 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <strong id="distance-summary">-</strong>
            </div>
          </div>
          <div class="summary-card">
            <div class="summary-inline-list">
              <div class="summary-inline-metric">
                <span class="summary-inline-label">
                  <span class="summary-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <path d="M12 18V6M12 6l-4 4M12 6l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                  <span class="summary-metric-prefix">Auf</span>
                </span>
                <strong id="ascent-summary">-</strong>
              </div>
              <div class="summary-inline-metric">
                <span class="summary-inline-label">
                  <span class="summary-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <path d="M12 6v12M12 18l-4-4M12 18l4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                  <span class="summary-metric-prefix">Ab</span>
                </span>
                <strong id="descent-summary">-</strong>
              </div>
            </div>
          </div>
          <div class="summary-card">
            <div class="summary-inline-list">
              <div class="summary-inline-metric">
                <span class="summary-metric-prefix">Min</span>
                <strong id="min-summary">-</strong>
              </div>
              <div class="summary-inline-metric">
                <span class="summary-metric-prefix">Max</span>
                <strong id="max-summary">-</strong>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel-actions">
        <button id="reset-points" type="button" class="primary-action">Punkte zurücksetzen</button>
      </div>

      <div class="panel-footer" aria-label="Projektlinks">
        <img src="https://img.shields.io/badge/Status-Experimental-red" alt="Status: Experimental" class="panel-footer-badge">
        <div class="panel-footer-links">
          <a class="panel-footer-link" href="https://github.com/vizsim/hilo_profiler" target="_blank" rel="noreferrer" aria-label="GitHub Repository">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2C6.48 2 2 6.58 2 12.22c0 4.5 2.87 8.31 6.84 9.66.5.1.68-.22.68-.49 0-.24-.01-1.04-.02-1.88-2.78.62-3.37-1.21-3.37-1.21-.46-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .08 1.53 1.06 1.53 1.06.9 1.57 2.35 1.12 2.92.86.09-.67.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.08 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05A9.3 9.3 0 0 1 12 6.84c.85 0 1.71.12 2.51.35 1.91-1.32 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.95-2.34 4.82-4.57 5.07.36.32.68.95.68 1.92 0 1.39-.01 2.5-.01 2.84 0 .27.18.6.69.49A10.24 10.24 0 0 0 22 12.22C22 6.58 17.52 2 12 2Z" fill="currentColor"/>
            </svg>
          </a>
          <a class="panel-footer-link panel-footer-link-issues" href="https://github.com/vizsim/hilo_profiler/issues" target="_blank" rel="noreferrer" aria-label="Issues">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="8" r="1.3" fill="currentColor"/>
              <path d="M12 11v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>Issues</span>
          </a>
        </div>
      </div>
    </div>
  </section>

  <button id="map-settings-toggle" class="map-settings-toggle" type="button" aria-expanded="true" aria-controls="map-settings-panel" title="Kartenauswahl">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 6.5 8.5 4l7 2.5L21 4v13.5L15.5 20l-7-2.5L3 20V6.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M8.5 4v13.5M15.5 6.5V20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
    <span class="sr-only">Kartenauswahl</span>
  </button>

  <section id="map-settings-panel" class="map-settings-panel" aria-labelledby="map-settings-title">
    <div class="section-title-row panel-section-header">
      <h2 id="map-settings-title">Basemap</h2>
      <button
        id="map-settings-panel-toggle"
        class="panel-toggle"
        type="button"
        aria-expanded="true"
        aria-controls="map-settings-panel-content"
        title="Panel minimieren"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="sr-only">Panel minimieren</span>
      </button>
    </div>

    <div id="map-settings-panel-content" class="map-settings-panel-content">
      <div class="basemap-grid">
      <button class="basemap-btn basemap-btn-compact selected" type="button" data-map="positron">
        <span class="basemap-preview basemap-preview-positron"></span>
        <span class="basemap-label">Positron</span>
      </button>
      <button class="basemap-btn basemap-btn-compact" type="button" data-map="dark">
        <span class="basemap-preview basemap-preview-dark"></span>
        <span class="basemap-label">Dark</span>
      </button>
      <button class="basemap-btn basemap-btn-compact" type="button" data-map="osm">
        <span class="basemap-preview basemap-preview-osm"></span>
        <span class="basemap-label">OSM Carto</span>
      </button>
      <button class="basemap-btn basemap-btn-imagery" type="button" data-map="satellite">
        <span class="basemap-preview basemap-preview-satellite"></span>
        <span class="basemap-label">Esri Imagery</span>
      </button>
      <button id="eli-basemap-button" class="basemap-btn basemap-btn-local" type="button" data-map="eli-local">
        <span class="basemap-preview basemap-preview-local"></span>
        <span class="basemap-label-row">
          <span class="basemap-label">Lokales DOP</span>
          <span class="basemap-hint">Zoom nötig</span>
        </span>
        <span id="eli-basemap-button-meta" class="basemap-meta">Suche Verfügbarkeit ...</span>
        <span id="eli-basemap-button-detail" class="basemap-detail">ELI wird geladen.</span>
      </button>
      </div>

      <div class="terrain-options">
        <div class="terrain-row">
          <div>
            <strong>Terrain</strong>
            <p>3D-Oberfläche</p>
          </div>
          <label class="switch">
            <input id="toggle-terrain" type="checkbox" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="terrain-row">
          <div>
            <strong>Hillshade</strong>
            <p>Reliefschummerung</p>
          </div>
          <label class="switch">
            <input id="toggle-hillshade" type="checkbox" checked />
            <span class="switch-slider"></span>
          </label>
        </div>
      </div>
    </div>
  </section>

  <div id="context-menu" class="context-menu hidden" aria-hidden="true">
    <button id="context-menu-set-start" type="button" class="context-menu-item">
      <span class="context-menu-icon start" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 21s-5-4.35-5-9a5 5 0 1 1 10 0c0 4.65-5 9-5 9Z" fill="currentColor"/>
          <circle cx="12" cy="12" r="2.2" fill="#ffffff"/>
        </svg>
      </span>
      <span>Als Start setzen</span>
    </button>
    <button id="context-menu-set-end" type="button" class="context-menu-item">
      <span class="context-menu-icon end" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M7 4v16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M8.5 5.5h8l-2.7 3 2.7 3h-8Z" fill="currentColor"/>
        </svg>
      </span>
      <span>Als Ziel setzen</span>
    </button>
    <button id="context-menu-add-waypoint" type="button" class="context-menu-item">
      <span class="context-menu-icon waypoint" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" fill="currentColor"/>
          <path d="M12 8v8M8 12h8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span>Zwischenpunkt hinzufügen</span>
    </button>
  </div>

  <div id="waypoint-context-menu" class="context-menu waypoint-context-menu hidden" aria-hidden="true">
    <button id="waypoint-context-menu-delete" type="button" class="context-menu-item danger">Zwischenpunkt entfernen</button>
  </div>

  <div id="eli-basemap-menu" class="context-menu hidden" aria-hidden="true"></div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
